<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 64" width="76" height="64" role="img"
     aria-label="Signals travelling across the lab's network as a new member joins an open place">
  <style>
    .edge { fill: none; stroke: #cbd5e1; stroke-width: 1.3; stroke-linecap: round;
            stroke-dasharray: 3.5 3.5; animation: flow 1.5s linear infinite; }
    .e2 { animation-duration: 1.9s }  .e3 { animation-duration: 1.3s }
    .e4 { animation-duration: 2.2s }  .e5 { animation-duration: 1.7s }
    .hub  { fill: #1e40af; transform-box: fill-box; transform-origin: 50% 50%;
            animation: beat 2.6s ease-in-out infinite; }
    .node { fill: #1e40af; transform-box: fill-box; transform-origin: 50% 50%;
            animation: blip 2.4s ease-in-out infinite; }
    .n2 { animation-delay: .4s; fill: #3b82f6 }  .n3 { animation-delay: .8s }
    .n4 { animation-delay: 1.2s; fill: #3b82f6 } .n5 { animation-delay: 1.6s }

    .slot { fill: none; stroke: #93c5fd; stroke-width: 1.3; stroke-dasharray: 3 2.5;
            transform-box: fill-box; transform-origin: 50% 50%;
            animation: slot 5s ease-in-out infinite, spin 9s linear infinite; }
    .join-edge { fill: none; stroke: #3b82f6; stroke-width: 1.5; stroke-linecap: round;
                 stroke-dasharray: 24; animation: link 5s ease-in-out infinite; }
    .join-node { fill: #3b82f6; transform-box: fill-box; transform-origin: 50% 50%;
                 animation: land 5s cubic-bezier(.3,1.4,.5,1) infinite; }
    .pulse { fill: none; stroke: #3b82f6; stroke-width: 1.2; transform-box: fill-box;
             transform-origin: 50% 50%; animation: pulse 5s ease-out infinite; }

    @keyframes flow  { to { stroke-dashoffset: -14 } }
    @keyframes beat  { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.12) } }
    @keyframes blip  { 0%, 70%, 100% { transform: scale(1); opacity: .85 }
                       35% { transform: scale(1.3); opacity: 1 } }
    @keyframes slot  { 0%, 24% { opacity: 1 } 34%, 100% { opacity: 0 } }
    @keyframes spin  { to { transform: rotate(360deg) } }
    @keyframes link  { 0%, 22% { stroke-dashoffset: 24 } 40%, 92% { stroke-dashoffset: 0 }
                       100% { stroke-dashoffset: 24 } }
    @keyframes land  { 0%, 26% { transform: translate(10px, 9px) scale(0); opacity: 0 }
                       42%, 92% { transform: translate(0, 0) scale(1); opacity: 1 }
                       100% { transform: translate(10px, 9px) scale(0); opacity: 0 } }
    @keyframes pulse { 0%, 42% { transform: scale(.6); opacity: 0 }
                       54% { opacity: .5 } 74%, 100% { transform: scale(2.4); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .edge, .hub, .node, .join-node, .slot, .pulse { animation: none }
      .slot, .pulse { opacity: 0 }
      .join-edge { animation: none; stroke-dashoffset: 0 }
      .join-node { opacity: 1 }
    }
  </style>

  <!-- signals keep moving along the links -->
  <path class="edge"    d="M38 32 L16 21"></path>
  <path class="edge e2" d="M38 32 L16 45"></path>
  <path class="edge e3" d="M38 32 L38 10"></path>
  <path class="edge e4" d="M38 32 L60 21"></path>
  <path class="edge e5" d="M38 32 L38 54"></path>

  <circle class="node"    cx="16" cy="21" r="3.6"></circle>
  <circle class="node n2" cx="16" cy="45" r="3.2"></circle>
  <circle class="node n3" cx="38" cy="10" r="3.6"></circle>
  <circle class="node n4" cx="60" cy="21" r="3.2"></circle>
  <circle class="node n5" cx="38" cy="54" r="3.6"></circle>
  <circle class="hub" cx="38" cy="32" r="5.2"></circle>

  <!-- the open place, and the person who takes it -->
  <circle class="slot" cx="60" cy="45" r="5"></circle>
  <path class="join-edge" d="M38 32 L60 45"></path>
  <circle class="pulse" cx="60" cy="45" r="5"></circle>
  <circle class="join-node" cx="60" cy="45" r="4.4"></circle>
</svg>
