<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 60" width="92" height="60" role="img"
     aria-label="A new member joining the lab's network">
  <style>
    .edge { fill: none; stroke: #cbd5e1; stroke-width: 1.3; stroke-linecap: round; }
    .node { fill: #1e40af; }
    .node-soft { fill: #93c5fd; }
    .slot { fill: none; stroke: #93c5fd; stroke-width: 1.3; stroke-dasharray: 3 2.5;
            animation: slot 5s ease-in-out infinite; }
    .join-edge { fill: none; stroke: #3b82f6; stroke-width: 1.5; stroke-linecap: round;
                 stroke-dasharray: 26; animation: link 5s ease-in-out infinite; }
    .join-node { fill: #3b82f6; transform-box: fill-box; transform-origin: 50% 50%;
                 animation: land 5s ease-in-out infinite; }
    .pulse { fill: none; stroke: #3b82f6; stroke-width: 1.2; transform-box: fill-box;
             transform-origin: 50% 50%; animation: pulse 5s ease-in-out infinite; }
    @keyframes slot  { 0%, 26% { opacity: 1 } 36%, 100% { opacity: 0 } }
    @keyframes link  { 0%, 24% { stroke-dashoffset: 26 } 44%, 92% { stroke-dashoffset: 0 }
                       100% { stroke-dashoffset: 26 } }
    @keyframes land  { 0%, 28% { transform: scale(0); opacity: 0 }
                       44% { transform: scale(1.25); opacity: 1 }
                       52%, 92% { transform: scale(1); opacity: 1 }
                       100% { transform: scale(0); opacity: 0 } }
    @keyframes pulse { 0%, 46% { transform: scale(0.6); opacity: 0 }
                       58% { opacity: 0.55 } 76%, 100% { transform: scale(2.2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .slot { animation: none; opacity: 0 }
      .join-edge { animation: none; stroke-dashoffset: 0 }
      .join-node { animation: none; opacity: 1; transform: none }
      .pulse { animation: none; opacity: 0 }
    }
  </style>

  <!-- the lab as it stands -->
  <path class="edge" d="M20 18 L42 12 M20 18 L30 38 M42 12 L30 38 M42 12 L58 28 M30 38 L58 28"></path>
  <circle class="node" cx="20" cy="18" r="4"></circle>
  <circle class="node" cx="42" cy="12" r="4"></circle>
  <circle class="node-soft" cx="30" cy="38" r="3.4"></circle>
  <circle class="node" cx="58" cy="28" r="4"></circle>

  <!-- the open place, and the person who takes it -->
  <circle class="slot" cx="74" cy="46" r="5"></circle>
  <path class="join-edge" d="M58 28 L74 46"></path>
  <circle class="pulse" cx="74" cy="46" r="5"></circle>
  <circle class="join-node" cx="74" cy="46" r="4.6"></circle>
</svg>
