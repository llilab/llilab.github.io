<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160" role="img"
     aria-label="Mislabeled training points being corrected so the decision boundary settles">
  <style>
    .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .lbl   { font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
             font-size: 9px; fill: #9ca3af; letter-spacing: 0.04em; }
    .lbl-bad { fill: #b91c1c; }
    .cls-a { fill: #3b82f6; }
    .cls-b { fill: #94a3b8; }
    .bound { stroke: #0d1b2a; stroke-width: 1.6; stroke-linecap: round;
             transform-box: fill-box; transform-origin: 50% 50%;
             animation: settle 6s ease-in-out infinite; }
    .wrong { animation: fade-out 6s ease-in-out infinite }
    .fixed { animation: fade-in 6s ease-in-out infinite }
    .flag  { animation: flag 6s ease-in-out infinite }
    @keyframes settle   { 0%, 18% { transform: rotate(-7deg) } 46%, 88% { transform: rotate(0deg) }
                          100% { transform: rotate(-7deg) } }
    @keyframes fade-out { 0%, 24% { opacity: 1 } 42%, 90% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes fade-in  { 0%, 24% { opacity: 0 } 42%, 90% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes flag     { 0%, 20% { opacity: 1 } 40%, 92% { opacity: 0 } 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .bound, .wrong, .flag { animation: none }
      .wrong, .flag { opacity: 0 }
      .fixed { animation: none; opacity: 1 }
    }
  </style>

  <text class="lbl" x="12" y="20">TRAINING DATA</text>
  <rect class="panel" x="10" y="28" width="300" height="116" rx="8"></rect>

  <!-- class A, lower left -->
  <circle class="cls-a" cx="52" cy="112" r="4.5"></circle>
  <circle class="cls-a" cx="74" cy="98" r="4.5"></circle>
  <circle class="cls-a" cx="60" cy="84" r="4.5"></circle>
  <circle class="cls-a" cx="92" cy="118" r="4.5"></circle>
  <circle class="cls-a" cx="100" cy="92" r="4.5"></circle>
  <circle class="cls-a" cx="122" cy="110" r="4.5"></circle>

  <!-- class B, upper right -->
  <rect class="cls-b" x="196" y="52" width="8" height="8" rx="1.5"></rect>
  <rect class="cls-b" x="222" y="68" width="8" height="8" rx="1.5"></rect>
  <rect class="cls-b" x="244" y="46" width="8" height="8" rx="1.5"></rect>
  <rect class="cls-b" x="264" y="72" width="8" height="8" rx="1.5"></rect>
  <rect class="cls-b" x="212" y="92" width="8" height="8" rx="1.5"></rect>
  <rect class="cls-b" x="256" y="104" width="8" height="8" rx="1.5"></rect>

  <!-- two mislabeled points swap to the right class -->
  <rect class="cls-b wrong" x="82" y="64" width="8" height="8" rx="1.5"></rect>
  <circle class="cls-a fixed" cx="86" cy="68" r="4.5"></circle>
  <circle class="flag" cx="86" cy="68" r="9" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 2"></circle>

  <circle class="cls-a wrong" cx="238" cy="120" r="4.5"></circle>
  <rect class="cls-b fixed" x="234" y="116" width="8" height="8" rx="1.5"></rect>
  <circle class="flag" cx="238" cy="120" r="9" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 2"></circle>

  <text class="lbl lbl-bad flag" x="86" y="48" text-anchor="middle">mislabeled</text>

  <!-- decision boundary: wobbles, then settles -->
  <line class="bound" x1="148" y1="136" x2="192" y2="38"></line>
</svg>
