<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="320" height="190" role="img"
     aria-label="Mislabeled points are flagged and corrected, the decision boundary settles, robust accuracy climbs, and a curriculum window sweeps the training set from easy to hard">
  <style>
    .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .lbl   { font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
             font-size: 8px; fill: #9ca3af; letter-spacing: 0.06em; }
    .bad   { fill: #b91c1c; }
    .axis  { fill: none; stroke: #e5e7eb; stroke-width: 1; }
    .a     { fill: #3b82f6; }
    .b     { fill: #94a3b8; }

    .bound  { stroke: #0d1b2a; stroke-width: 1.6; stroke-linecap: round;
              transform-box: fill-box; transform-origin: 50% 50%;
              animation: settle 8s ease-in-out infinite; }
    .wrong  { animation: out 8s ease-in-out infinite }
    .fixed  { animation: in 8s ease-in-out infinite }
    .flag   { animation: flag 8s ease-in-out infinite }
    .f2 { animation-delay: .5s }   .f3 { animation-delay: 1s }

    .jit    { fill: none; stroke: #cbd5e1; stroke-width: 1.4; animation: out 8s ease-in-out infinite }
    .smooth { fill: none; stroke: #3b82f6; stroke-width: 1.6; stroke-dasharray: 150;
              animation: trace 8s ease-in-out infinite }
    .runner { fill: #1e40af; animation: run 8s ease-in-out infinite }

    .win    { fill: #3b82f6; fill-opacity: .07; stroke: #3b82f6; stroke-width: 1.2;
              animation: sweep 8s ease-in-out infinite }
    .seen   { animation: seen 8s ease-in-out infinite }

    @keyframes settle { 0%, 14% { transform: rotate(-8deg) } 20% { transform: rotate(4deg) }
                        30% { transform: rotate(-2deg) } 44%, 88% { transform: rotate(0deg) }
                        100% { transform: rotate(-8deg) } }
    @keyframes out    { 0%, 22% { opacity: 1 } 40%, 92% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes in     { 0%, 22% { opacity: 0 } 40%, 92% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes flag   { 0%, 6% { opacity: 0 } 12%, 30% { opacity: 1 } 42%, 100% { opacity: 0 } }
    @keyframes trace  { 0%, 20% { stroke-dashoffset: 150 } 62%, 92% { stroke-dashoffset: 0 }
                        100% { stroke-dashoffset: 150 } }
    @keyframes run    { 0%, 20% { transform: translate(0, 0); opacity: 0 }
                        26% { opacity: 1 }
                        34% { transform: translate(20px, -12px) }
                        46% { transform: translate(40px, -20px) }
                        58% { transform: translate(60px, -31px) }
                        70%, 92% { transform: translate(80px, -38px); opacity: 1 }
                        100% { transform: translate(80px, -38px); opacity: 0 } }
    @keyframes sweep  { 0%, 8% { transform: translateX(0) } 88%, 100% { transform: translateX(232px) } }
    @keyframes seen   { from { fill: #e5e7eb } to { fill: #3b82f6 } }
    @media (prefers-reduced-motion: reduce) {
      .bound, .wrong, .fixed, .flag, .jit, .smooth, .runner, .win, .seen {
        animation: none; transform: none; stroke-dashoffset: 0;
      }
      .wrong, .flag { opacity: 0 } .fixed, .runner { opacity: 1 }
    }
  </style>

  <text class="lbl" x="8" y="17">TRAINING DATA</text>
  <text class="lbl" x="206" y="17">ROBUST ACCURACY</text>
  <rect class="panel" x="8" y="24" width="186" height="104" rx="8"></rect>
  <rect class="panel" x="206" y="24" width="106" height="104" rx="8"></rect>

  <!-- class A -->
  <circle class="a" cx="34" cy="108" r="4.2"></circle>
  <circle class="a" cx="54" cy="92" r="4.2"></circle>
  <circle class="a" cx="40" cy="78" r="4.2"></circle>
  <circle class="a" cx="72" cy="112" r="4.2"></circle>
  <circle class="a" cx="78" cy="88" r="4.2"></circle>
  <circle class="a" cx="60" cy="62" r="4.2"></circle>
  <circle class="a" cx="98" cy="104" r="4.2"></circle>
  <!-- class B -->
  <rect class="b" x="128" y="44" width="8" height="8" rx="1.5"></rect>
  <rect class="b" x="150" y="58" width="8" height="8" rx="1.5"></rect>
  <rect class="b" x="166" y="40" width="8" height="8" rx="1.5"></rect>
  <rect class="b" x="172" y="66" width="8" height="8" rx="1.5"></rect>
  <rect class="b" x="146" y="86" width="8" height="8" rx="1.5"></rect>
  <rect class="b" x="170" y="98" width="8" height="8" rx="1.5"></rect>

  <!-- three mislabeled points, flagged then corrected -->
  <rect class="b wrong" x="62" y="40" width="8" height="8" rx="1.5"></rect>
  <circle class="a fixed" cx="66" cy="44" r="4.2"></circle>
  <circle class="flag" cx="66" cy="44" r="9" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 2"></circle>

  <circle class="a wrong" cx="156" cy="112" r="4.2"></circle>
  <rect class="b fixed" x="152" y="108" width="8" height="8" rx="1.5"></rect>
  <circle class="flag f2" cx="156" cy="112" r="9" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 2"></circle>

  <circle class="a wrong" cx="118" cy="62" r="4.2"></circle>
  <rect class="b fixed" x="114" y="58" width="8" height="8" rx="1.5"></rect>
  <circle class="flag f3" cx="118" cy="62" r="9" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 2"></circle>

  <text class="lbl bad flag" x="66" y="34" text-anchor="middle">mislabeled</text>
  <line class="bound" x1="96" y1="122" x2="140" y2="34"></line>

  <!-- accuracy: a jittery run gives way to a stable one -->
  <path class="axis" d="M216 36 V116 H304"></path>
  <polyline class="jit" points="216,106 232,96 248,100 264,84 280,90 296,74"></polyline>
  <polyline class="smooth" points="216,108 236,96 256,88 276,76 296,70"></polyline>
  <circle class="runner" cx="216" cy="108" r="3.2"></circle>

  <!-- curriculum: the window sweeps from easy to hard -->
  <text class="lbl" x="8" y="146">CURRICULUM</text>
  <g>
    <rect class="seen" x="8" y="152" width="16" height="10" rx="2" fill="#e5e7eb"></rect>
    <rect class="seen" x="30" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:.55s"></rect>
    <rect class="seen" x="52" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:1.1s"></rect>
    <rect class="seen" x="74" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:1.65s"></rect>
    <rect class="seen" x="96" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:2.2s"></rect>
    <rect class="seen" x="118" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:2.75s"></rect>
    <rect class="seen" x="140" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:3.3s"></rect>
    <rect class="seen" x="162" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:3.85s"></rect>
    <rect class="seen" x="184" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:4.4s"></rect>
    <rect class="seen" x="206" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:4.95s"></rect>
    <rect class="seen" x="228" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:5.5s"></rect>
    <rect class="seen" x="250" y="152" width="16" height="10" rx="2" fill="#e5e7eb" style="animation-delay:6.05s"></rect>
  </g>
  <rect class="win" x="4" y="148" width="44" height="18" rx="5"></rect>
  <text class="lbl" x="312" y="161" text-anchor="end">hard</text>
</svg>
