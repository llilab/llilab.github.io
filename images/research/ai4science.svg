<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="320" height="190" role="img"
     aria-label="A SMILES string is encoded into a molecular graph, aligned cell by cell with the text that describes it, and read out as a predicted property">
  <style>
    .panel  { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .lbl    { font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
              font-size: 8px; fill: #9ca3af; letter-spacing: 0.06em; }
    .mono   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 7.5px; fill: #4b5563; }
    .bond   { fill: none; stroke: #0d1b2a; stroke-width: 1.5; stroke-linecap: round; }
    .bondi  { fill: none; stroke: #0d1b2a; stroke-width: 1; stroke-linecap: round; }
    .atom   { fill: #ffffff; stroke: #0d1b2a; stroke-width: 1.3; transform-box: fill-box;
              transform-origin: 50% 50%; animation: pop 9s ease-in-out infinite; }
    .bar    { fill: #e5e7eb; }
    .cell   { fill: #eef2f7; }
    .chip   { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }

    /* the ring draws itself, then the substituent, then the double bonds */
    .ring   { stroke-dasharray: 160; animation: draw 9s ease-in-out infinite; }
    .sub    { stroke-dasharray: 22; animation: draw-sub 9s ease-in-out infinite; }
    .bondi  { animation: late 9s ease-in-out infinite; }

    .tok    { transform-box: fill-box; animation: slide 9s ease-in-out infinite; }
    .tok1 { animation-delay: 0s }      .tok2 { animation-delay: .22s }
    .tok3 { animation-delay: .44s }    .tok4 { animation-delay: .66s }

    .lit    { animation: lit 9s ease-in-out infinite; }
    .lit1 { animation-delay: 3.2s }    .lit2 { animation-delay: 3.5s }
    .lit3 { animation-delay: 3.8s }    .lit4 { animation-delay: 4.1s }

    .hl     { animation: glow 9s ease-in-out infinite; }
    .link   { fill: none; stroke: #3b82f6; stroke-width: 1.2; stroke-dasharray: 3 3;
              animation: flow 1.5s linear infinite, glow 9s ease-in-out infinite; }
    .fill   { transform-box: fill-box; transform-origin: 0% 50%; animation: grow 9s ease-in-out infinite; }
    .fill2  { animation-delay: .3s }

    @keyframes draw     { 0%, 4% { stroke-dashoffset: 160 } 26%, 100% { stroke-dashoffset: 0 } }
    @keyframes draw-sub { 0%, 22% { stroke-dashoffset: 22 } 34%, 100% { stroke-dashoffset: 0 } }
    @keyframes late     { 0%, 30% { opacity: 0 } 40%, 100% { opacity: 1 } }
    @keyframes pop      { 0%, 10% { transform: scale(0); opacity: 0 }
                          30%, 100% { transform: scale(1); opacity: 1 } }
    @keyframes slide    { 0%, 2% { transform: translateX(-8px); opacity: 0 }
                          12%, 96% { transform: translateX(0); opacity: 1 }
                          100% { opacity: 0 } }
    @keyframes lit      { 0%, 2% { opacity: 0 } 8%, 26% { opacity: 1 } 34%, 100% { opacity: 0 } }
    @keyframes glow     { 0%, 38% { opacity: 0 } 48%, 82% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes flow     { to { stroke-dashoffset: -12 } }
    @keyframes grow     { 0%, 52% { transform: scaleX(0) } 72%, 94% { transform: scaleX(1) }
                          100% { transform: scaleX(0) } }
    @media (prefers-reduced-motion: reduce) {
      .atom, .ring, .sub, .bondi, .tok, .lit, .hl, .link, .fill {
        animation: none; opacity: 1; stroke-dashoffset: 0; transform: none;
      }
    }
  </style>

  <text class="lbl" x="8" y="17">MOLECULE</text>
  <text class="lbl" x="150" y="40" text-anchor="middle">ALIGN</text>
  <text class="lbl" x="188" y="17">DESCRIPTION</text>

  <rect class="panel" x="8" y="24" width="124" height="104" rx="8"></rect>
  <rect class="panel" x="188" y="24" width="124" height="104" rx="8"></rect>

  <!-- molecular graph, assembled bond by bond -->
  <path class="bond ring" d="M70 48 L92.5 61 L92.5 87 L70 100 L47.5 87 L47.5 61 Z"></path>
  <path class="bondi" d="M72 54 L87 62"></path>
  <path class="bondi" d="M88.5 66 L88.5 82"></path>
  <path class="bondi" d="M68 94 L53 86"></path>
  <path class="bond sub" d="M92.5 61 L110 51"></path>
  <g>
    <circle class="atom" cx="70" cy="48" r="3.2"></circle>
    <circle class="atom" cx="92.5" cy="61" r="3.2" style="animation-delay:.15s"></circle>
    <circle class="atom" cx="92.5" cy="87" r="3.2" style="animation-delay:.3s"></circle>
    <circle class="atom" cx="70" cy="100" r="3.2" style="animation-delay:.45s"></circle>
    <circle class="atom" cx="47.5" cy="87" r="3.2" style="animation-delay:.6s"></circle>
    <circle class="atom" cx="47.5" cy="61" r="3.2" style="animation-delay:.75s"></circle>
    <circle class="atom" cx="113" cy="49" r="4.4" style="animation-delay:1.1s"></circle>
  </g>
  <g class="hl">
    <circle cx="103" cy="55" r="14" fill="#3b82f6" opacity="0.13"></circle>
    <path d="M92.5 61 L110 51" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round"></path>
    <circle cx="113" cy="49" r="4.4" fill="#ffffff" stroke="#1e40af" stroke-width="1.6"></circle>
  </g>

  <!-- SMILES tokens feeding the encoder -->
  <text class="lbl" x="8" y="144">SMILES</text>
  <g>
    <g class="tok tok1"><rect class="chip" x="8" y="150" width="28" height="16" rx="4"></rect>
      <text class="mono" x="22" y="161" text-anchor="middle">C1=C</text></g>
    <g class="tok tok2"><rect class="chip" x="40" y="150" width="28" height="16" rx="4"></rect>
      <text class="mono" x="54" y="161" text-anchor="middle">C=C</text></g>
    <g class="tok tok3"><rect class="chip" x="72" y="150" width="30" height="16" rx="4"></rect>
      <text class="mono" x="87" y="161" text-anchor="middle">C(=O)</text></g>
    <g class="tok tok4"><rect class="chip" x="106" y="150" width="26" height="16" rx="4"></rect>
      <text class="mono" x="119" y="161" text-anchor="middle">O1</text></g>
  </g>

  <!-- cross-modal alignment matrix -->
  <g>
    <rect class="cell" x="136" y="48" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="146" y="48" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="156" y="48" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="136" y="58" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="146" y="58" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="156" y="58" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="136" y="68" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="146" y="68" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="156" y="68" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="136" y="78" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="146" y="78" width="7" height="7" rx="1.5"></rect>
    <rect class="cell" x="156" y="78" width="7" height="7" rx="1.5"></rect>
    <rect class="lit lit1" x="136" y="48" width="7" height="7" rx="1.5" fill="#3b82f6"></rect>
    <rect class="lit lit2" x="146" y="58" width="7" height="7" rx="1.5" fill="#1e40af"></rect>
    <rect class="lit lit3" x="146" y="68" width="7" height="7" rx="1.5" fill="#3b82f6"></rect>
    <rect class="lit lit4" x="156" y="78" width="7" height="7" rx="1.5" fill="#1e40af"></rect>
  </g>
  <path class="link" d="M124 56 C130 56 132 54 134 54"></path>
  <path class="link" d="M166 62 C176 62 180 64 186 66"></path>

  <!-- caption lines, with the phrase that matches the substructure -->
  <rect class="bar" x="198" y="42" width="96" height="6" rx="3"></rect>
  <rect class="bar" x="198" y="58" width="84" height="6" rx="3"></rect>
  <rect class="bar" x="198" y="74" width="100" height="6" rx="3"></rect>
  <rect class="bar" x="198" y="90" width="70" height="6" rx="3"></rect>
  <rect class="bar" x="198" y="106" width="88" height="6" rx="3"></rect>
  <g class="hl">
    <rect x="208" y="54" width="54" height="14" rx="4" fill="#3b82f6" opacity="0.13"></rect>
    <rect x="210" y="58" width="50" height="6" rx="3" fill="#1e40af"></rect>
  </g>

  <!-- predicted property -->
  <text class="lbl" x="188" y="144">PREDICTED PROPERTY</text>
  <rect x="188" y="150" width="112" height="6" rx="3" fill="#f3f4f6"></rect>
  <rect class="fill" x="188" y="150" width="82" height="6" rx="3" fill="#3b82f6"></rect>
  <rect x="188" y="162" width="112" height="6" rx="3" fill="#f3f4f6"></rect>
  <rect class="fill fill2" x="188" y="162" width="54" height="6" rx="3" fill="#93c5fd"></rect>
</svg>
